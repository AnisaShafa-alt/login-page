<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Baca | Login</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff3f8;
        }

        .navbar {
            background-color: #e98bb3;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .navbar .nav-link {
            color: white !important;
            margin-left: 12px;
        }

        .navbar .nav-link:hover {
            color: #ffe0ee !important;
        }

        .login-section {
            min-height: calc(100vh - 56px);
            background-color: #fff3f8;
        }

        .login-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(210, 113, 156, 0.15);
        }

        .card-title {
            color: #b94f7e;
            font-weight: bold;
        }

        .subtitle {
            color: #a88a99;
            font-size: 14px;
        }

        .form-label {
            color: #775469;
            font-size: 14px;
        }

        .form-control {
            border: 1px solid #f0cfdf;
            border-radius: 7px;
        }

        .form-control:focus {
            border-color: #e98bb3;
            box-shadow: 0 0 0 0.2rem rgba(233, 139, 179, 0.2);
        }

        .form-check-label {
            color: #775469;
            font-size: 14px;
        }

        .form-check-input:checked {
            background-color: #e98bb3;
            border-color: #e98bb3;
        }

        .btn-pink {
            background-color: #e98bb3;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 10px;
            font-weight: 500;
        }

        .btn-pink:hover {
            background-color: #d66b9a;
            color: white;
        }

        .card-footer {
            background-color: #fff7fa;
            border-top: 1px solid #f7dfeb;
        }

        .forgot-link {
            color: #cf709a;
            font-size: 14px;
            text-decoration: underline;
        }

        .forgot-link:hover {
            color: #a94c78;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="#">
                Ruang Baca ♡
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Beranda
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Tentang
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Bantuan
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid login-section py-5">

        <div class="row justify-content-center">

            <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">

                <div class="card login-card">

                    <div class="card-body p-4">

                        <h4 class="card-title text-center mb-2">
                            Masuk ke Ruang Baca
                        </h4>

                        <p class="subtitle text-center mb-4">
                            Temukan bacaan untuk hari ini.
                        </p>

                        <form>

                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    name="username"
                                    placeholder="Masukkan username">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Masukkan password">
                            </div>

                            <div class="form-check mb-3">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="ingatSaya">

                                <label class="form-check-label"
                                    for="ingatSaya">
                                    Ingat saya
                                </label>

                            </div>

                            <div class="d-grid">
                                <button type="button" class="btn btn-pink">
                                    Masuk
                                </button>
                            </div>

                        </form>

                    </div>

                    <!-- Footer Login -->
                    <div class="card-footer text-center py-3">

                        <a href="#" class="forgot-link">
                            Lupa password?
                        </a>

                    </div>

                </div>

            </div>
        </div>

    </main>

    <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
